[project]
name = "highway"
version = "0.1.0"
description = "DeepL course project: a minimal Highway Network on CIFAR-10"
readme = "README.md"
authors = [
    { name = "Zdziszkee", email = "zdziszkee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.10.0",
    "notebook>=7.6.5",
    "scikit-learn>=1.9.1",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

# No importable package: the notebook is the whole project.
[tool.uv]
package = false


# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"


# ------------------------------------------------------------------ ty ----
[tool.ty.environment]
python-version = "3.15"
